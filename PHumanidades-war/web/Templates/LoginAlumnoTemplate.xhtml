<?xml version='1.0' encoding='UTF-8' ?> 
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:b="http://bootsfaces.net/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <link href="./resources/css/personalizado.css" rel="stylesheet" type="text/css" />
        <link href="./resources/css/login.css" rel="stylesheet" type="text/css" />
        <script src="https://www.google.com/recaptcha/api.js"></script>
        <title>Facultad de Humanidades</title>
    </h:head>
    
    <script type="text/javascript">

    </script>

    <h:body>
        <f:view contentType="text/html">            <h:form id="frmPri" enctype="multipart/form-data">

                <!-- Spinner overlay CSS -->
                <style>
                    #loadingOverlay {
                        display: none;
                        position: fixed;
                        top: 0; left: 0;
                        width: 100%; height: 100%;
                        background: rgba(0, 0, 0, 0.45);
                        z-index: 9999;
                        justify-content: center;
                        align-items: center;
                    }
                    #loadingOverlay.active { display: flex; }
                    .ph-spinner {
                        width: 56px; height: 56px;
                        border: 6px solid rgba(255,255,255,0.25);
                        border-top-color: #ffffff;
                        border-radius: 50%;
                        animation: ph-spin 0.75s linear infinite;
                    }
                    @keyframes ph-spin { to { transform: rotate(360deg); } }
                </style>
                <div id="loadingOverlay"><div class="ph-spinner"></div></div>
                <p:ajaxStatus onstart="document.getElementById('loadingOverlay').classList.add('active')"
                              onsuccess="document.getElementById('loadingOverlay').classList.remove('active')"
                              onerror="document.getElementById('loadingOverlay').classList.remove('active')" />


                <p:dialog header="La session esta por finalizar!"
                          widgetVar="timeoutDialog" 
                          showEffect="fade" 
                          hideEffect="fade" 
                          modal="true"
                          width="400"
                          height="200"
                          closable="false"
                          draggable="false"
                          resizable="false" position="top"
                          > 
                    <br/>
                    <p>
                        <span class="ui-icon ui-icon-alert" style="float:left; margin:0 7px 50px 0;"></span>
                        <div>Se cerrara la sesion en  <span id="dialog-countdown" style="font-weight:bold"></span> segundos.</div>
                    </p>
                    <br/><br/>
                    <h:outputText value="¿Deseas continuar con la session?"/>

                    <center>
                        <p:commandButton value="SI"  oncomplete="resetPageTimer()"/>
                        <p:commandButton value="No"  action="#{sessionControlerBean.cerrarSession()}" oncomplete="redirectLogin()"/>
                    </center>

                </p:dialog>

                <p:dialog header="La session ha expirado!"
                          widgetVar="dlgFinSession" 
                          showEffect="fade" 
                          hideEffect="fade" 
                          modal="true"
                          width="400"
                          height="200"
                          closable="false"
                          draggable="false"
                          resizable="false" 
                          position="top"
                          > 
                    <br/>
                    <p>
                        <span class="ui-icon ui-icon-alert" style="float:left; margin:0 7px 50px 0;"></span>
                        <div> <h:outputText value="La session termino. "/></div><br/>
                        <a href="index.xhtml">
                            Presione aca para ingresar nuevamente
                        </a>
                    </p>
                    <br/>


                </p:dialog>




            </h:form>
            <ui:insert name="content">Content</ui:insert>

            <b:navBar fixed="bottom" static="false" sticky="false" style="border-top: 1px solid #e5e7eb; background: white; padding: 10px 0;">
                <b:container>
                    <b:navbarLinks pull="left" style="display: flex; align-items: center;">
                        <img src="./Imagenes/LogoFacultadHumanidades.png" alt="" height="40px" style="margin-right: 15px;" />
                        <span style="font-size: 0.9rem; color: var(--text-muted);">Universidad Nacional de Catamarca</span>
                    </b:navbarLinks>
                    <b:navbarLinks pull="right" style="text-align: right; font-size: 0.8rem; color: var(--text-muted); line-height: 1.4;">
                        Avda Belgrano Nº 300<br/>
                        San Fernando del Valle de Catamarca
                    </b:navbarLinks> 
                </b:container>
            </b:navBar>
        </f:view>
    </h:body>

</html>
